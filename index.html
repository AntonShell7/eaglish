<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sizes are declared so the browser picks the tile drawn for that box: the
         mark is cropped tighter at 16px, where the original's padding left it
         reading as a violet smudge. ?v=3 forces a refetch past the cached one. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=3" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <!-- Colours the browser's own chrome on a phone. It was still the old
         brand violet, so the app opened inside a violet frame it no longer has
         anywhere. One value per theme, matching the ground the page paints. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131210" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eaglish — английский через чтение, аудирование и слова, которые возвращаются на повторение сами." />

    <!-- Link previews: without these, a shared link shows a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eaglish" />
    <meta property="og:title" content="Eaglish — английский, который остаётся" />
    <meta
      property="og:description"
      content="Читай то, что читал бы всё равно. Слова, которые встретились, вернутся сами — ровно тогда, когда ты бы их забыл."
    />
    <!-- 1200×630, because the preview card is the first thing anyone sees:
         a link is shared before the site is opened, and an app icon stretched
         into that frame looks like something broken. -->
    <meta property="og:image" content="/og.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://eaglish.ru/" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eaglish — английский, который остаётся" />
    <meta name="twitter:image" content="/og.png?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=swap"
      rel="stylesheet"
    />
    <title>Eaglish — Learn English</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
