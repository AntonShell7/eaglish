<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sizes are declared so the browser picks the tile drawn for that box: the
         mark is cropped tighter at 16px, where the original's padding left it
         reading as a violet smudge. ?v=2 forces a refetch past the cached one. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#3b168f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eaglish — learn English through reading, writing and listening." />

    <!-- Link previews: without these, a shared link shows a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eaglish" />
    <meta property="og:title" content="Eaglish — Learn English" />
    <meta
      property="og:description"
      content="Read what you'd read anyway. The words you meet come back — exactly when you'd have forgotten them."
    />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Eaglish — Learn English</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
