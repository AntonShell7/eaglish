<!--
  The password-recovery email.

  Supabase's default is three lines of English boilerplate and a blue
  underlined link, which looks like every phishing attempt anyone has ever
  received — and is the one message from us that a person reads while slightly
  anxious. It should look like the product they are about to walk back into.

  Email is not the web: no stylesheets, no custom fonts, no variables. Layout
  is tables because Outlook still parses HTML like it is 2003, the button is
  built from a padded table cell rather than a styled <a> for the same reason,
  and every colour is written out literally. The plain link under the button is
  not clutter — some clients strip buttons entirely, and without it those
  people have no way through.

  The palette is the app's own light theme: warm paper, pine, and the mint the
  learner sees a second later.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f1e8;margin:0;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="440" cellpadding="0" cellspacing="0" border="0" style="width:440px;max-width:100%;background:#fdfbf6;border:1px solid #e6dfd0;border-radius:18px;">
        <tr>
          <td style="padding:36px 36px 34px 36px;">

            <p style="margin:0 0 26px 0;font-size:14px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#1f6353;">
              Eaglish
            </p>

            <h1 style="margin:0 0 14px 0;font-family:Georgia,'Times New Roman',serif;font-size:27px;line-height:1.2;font-weight:700;color:#1c1a17;letter-spacing:-0.4px;">
              Новый пароль
            </h1>

            <p style="margin:0 0 30px 0;font-size:15px;line-height:1.65;color:#5b544a;">
              Нажми кнопку, чтобы создать новый пароль. Ссылка работает один раз и живёт час.
            </p>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background:#1f6353;border-radius:999px;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:inline-block;padding:15px 34px;font-size:15px;font-weight:700;color:#fdfbf6;text-decoration:none;">
                    Задать новый пароль
                  </a>
                </td>
              </tr>
            </table>

            <p style="margin:28px 0 0 0;font-size:12px;line-height:1.6;color:#8e8779;">
              Кнопка не работает? <a href="{{ .ConfirmationURL }}" style="color:#1f6353;font-weight:600;">Открой ссылку здесь</a>.
            </p>

          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
