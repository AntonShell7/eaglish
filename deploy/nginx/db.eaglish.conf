# db.eaglish.ru — TLS in front of the Supabase gateway.
#
# This server does one job: terminate HTTPS and hand the request to Kong,
# which is the gateway the self-hosted Supabase stack puts in front of its
# own services. The site itself stays on Vercel; nothing static is served
# from here.
#
# The browser talks to this host directly — the Supabase client runs in the
# page — so it needs a real certificate on a real name, which is why this
# lives on a subdomain of the domain you already own rather than on a bare
# IP address.

server {
    listen 80;
    listen [::]:80;
    server_name db.eaglish.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name db.eaglish.ru;

    # certbot --nginx fills these in on first run.
    ssl_certificate     /etc/letsencrypt/live/db.eaglish.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db.eaglish.ru/privkey.pem;

    # Writing submissions and bulk word lists are the largest things posted,
    # and they are text. A generous ceiling that is still far below anything
    # that could be used to fill the disk.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # GoTrue builds confirmation and reset links from this. Without it
        # every emailed link comes back as http:// and breaks on click.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime uses websockets. Harmless if that service is left out, and
        # one less thing to remember if it is ever switched on.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # The default 60s is short for a slow restore or a large select during
        # maintenance, and a timeout here surfaces to the learner as a failed
        # save rather than as a slow one.
        proxy_read_timeout 120s;
    }
}
