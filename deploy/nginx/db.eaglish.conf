# db.eaglish.ru — only what the application asks for.
#
# Everything used to be proxied through, and Supabase serves Studio at `/`:
# the database's own admin console, where every row of every table can be
# read and edited. The only thing in the way was a password, and a password
# on the open internet can be guessed at around the clock with nobody the
# wiser.
#
# The app talks to exactly three path groups. Everything else answers 404
# rather than 403, because a refusal tells you there is something there.
#
# Studio has not gone anywhere, it just no longer faces the internet:
#
#   ssh -N -L 8000:127.0.0.1:8000 root@89.111.170.134
#
# then open http://127.0.0.1:8000 in your own browser.

# The three proxied locations are identical but for their prefix. nginx has
# no include-within-server for this that is worth the indirection at three
# copies, so they are written out.

server {
    server_name db.eaglish.ru;

    client_max_body_size 4m;

    # Sign-up, sign-in, Google, password reset.
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Words, progress, activity. What anyone may actually read is decided by
    # the database's own row-level policies; this is only the route to them.
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Account deletion and the admin figures.
    location /functions/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/db.eaglish.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/db.eaglish.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = db.eaglish.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name db.eaglish.ru;
    return 404; # managed by Certbot
}
