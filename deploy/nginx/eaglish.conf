# The site itself, served from St Petersburg.
#
# It used to come from Vercel, and on 20 Oct 2026 that stopped working for the
# people it is for. `eaglish.ru` resolving to a foreign address turned out to
# be filtered: the hostname travels in clear inside the TLS handshake, small
# responses passed, and anything substantial died at about ten kilobytes — the
# 1.7 MB bundle, the stylesheet. The identical files fetched over
# `eaglish.vercel.app` arrived in a second and a half, which is what proved it
# was the name being filtered rather than Vercel, the build or the network.
#
# So everything the browser downloads now comes from a Russian address, and the
# serverless functions stay abroad because they call OpenAI and OpenAI refuses
# Russian callers. See src/lib/apiBase.ts for that half.
#
# This file is HTTP only. TLS is added by certbot once DNS points here:
#
#   certbot --nginx -d eaglish.ru -d www.eaglish.ru
#
# which rewrites these blocks in place, adds the certificate and the redirect
# from 80 to 443. Written this way round because nginx refuses to start with a
# `ssl_certificate` line naming a file that does not exist yet, and the
# certificate cannot be issued until the name resolves here.

server {
    listen 80;
    listen [::]:80;
    server_name eaglish.ru www.eaglish.ru;

    root /var/www/eaglish;
    index index.html;

    # Certbot writes its challenge here and needs it reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 92 MB of this is audio, and a learner on a phone will pull a lot of it.
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # Audio and images are compressed already; gzipping them spends processor
    # time to make them very slightly larger.

    # The same headers the Vercel deployment sent, kept so that moving the
    # hosting does not quietly weaken the site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Asset filenames carry a content hash, so a changed file is a changed
    # name and this can be cached for as long as the browser likes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Generated once, never regenerated, and the largest thing here by far.
    location /voice/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html is the one file that must never be cached: it is what names
    # the current bundle, and a stale copy points at files that no longer
    # exist — a blank page that clears itself only when the cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # A single-page application: every address that is not a real file is the
    # application itself, which then reads the path and renders the right
    # screen. Without this, reloading on /pricing is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
