# The site itself, served from St Petersburg.
#
# It used to come from Vercel, and on 20 Oct 2026 that stopped working for the
# people it is for. `eaglish.ru` resolving to a foreign address turned out to
# be filtered: the hostname travels in clear inside the TLS handshake, small
# responses passed, and anything substantial died at about ten kilobytes — the
# 1.7 MB bundle, the stylesheet. The identical files fetched over
# `eaglish.vercel.app` arrived in a second and a half, which is what proved it
# was the name being filtered rather than Vercel, the build or the network.
#
# So everything the browser downloads now comes from a Russian address, and the
# serverless functions stay abroad because they call OpenAI and OpenAI refuses
# Russian callers — confirmed from this very box, which gets 403 from
# api.openai.com. See src/lib/apiBase.ts for that half.
#
# The certificate was issued with `certonly --webroot`, so this file is the
# config rather than something certbot rewrote. Renewal needs the ACME
# challenge location below to keep working over plain HTTP; everything else
# redirects to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name eaglish.ru www.eaglish.ru;

    # Renewal writes its challenge here, and Let's Encrypt reads it over plain
    # HTTP. Must stay above the redirect, or renewal fails in ninety days.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://eaglish.ru$request_uri;
    }
}

# One canonical name. The certificate covers both, so this can happen after
# the handshake rather than before it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eaglish.ru;

    ssl_certificate /etc/letsencrypt/live/eaglish.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eaglish.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://eaglish.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eaglish.ru;

    ssl_certificate /etc/letsencrypt/live/eaglish.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eaglish.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/eaglish;
    index index.html;

    # 92 MB of this is audio, and a learner on a phone will pull a lot of it.
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # Audio and images are compressed already; gzipping them spends processor
    # time to make them very slightly larger.

    # The same headers the Vercel deployment sent, kept so that moving the
    # hosting does not quietly weaken the site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Asset filenames carry a content hash, so a changed file is a changed
    # name and this can be cached for as long as the browser likes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Generated once, never regenerated, and the largest thing here by far.
    location /voice/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fonts, with the same deal as the other assets — and, more to the point,
    # a real 404 when one is missing. Without this the single-page fallback
    # below catches the request and answers with index.html at 200, so a
    # mistyped or removed font looks fine to anything checking status codes
    # and quietly serves a page of HTML where a typeface should be.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html is the one file that must never be cached: it is what names
    # the current bundle, and a stale copy points at files that no longer
    # exist — a blank page that heals only when the cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # A single-page application: every address that is not a real file is the
    # application itself, which then reads the path and renders the right
    # screen. Without this, reloading on /pricing is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
