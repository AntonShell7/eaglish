# eaglish.ru — one server, three jobs.
#
#   /                the built SPA, served as static files
#   /api/…           the Node functions that were Vercel's serverless ones
#   /auth /rest /…   the self-hosted Supabase stack, behind its own gateway
#
# Everything on one origin on purpose. The app's Supabase client, its API
# calls and its audio all come from eaglish.ru, which means no CORS to
# configure, no second certificate, and nothing for a filtering middlebox to
# treat as a third-party request.

server {
    listen 80;
    listen [::]:80;
    server_name eaglish.ru www.eaglish.ru;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://eaglish.ru$request_uri;
    }
}

# www → apex, so the site has one address rather than two that look the same.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eaglish.ru;

    ssl_certificate     /etc/letsencrypt/live/eaglish.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eaglish.ru/privkey.pem;

    return 301 https://eaglish.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eaglish.ru;

    ssl_certificate     /etc/letsencrypt/live/eaglish.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eaglish.ru/privkey.pem;

    root /var/www/eaglish;
    index index.html;

    # 95 MB of build, most of it the 4,973 dictation clips. Compression is
    # pointless on .m4a — it is already compressed — so it is restricted to
    # the things it actually helps.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 8m;

    # ── The app's own API ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A model answer can legitimately take a while; the default 60s cuts
        # off long generations and shows the learner a failure that was not one.
        proxy_read_timeout 120s;
    }

    # ── Supabase, through its own gateway ────────────────────────────────
    # Kong listens on 8000 in the default self-hosted compose.
    location ~ ^/(auth|rest|realtime|storage|functions)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Static ───────────────────────────────────────────────────────────
    # Vite fingerprints its assets, so they can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The clips never change once generated — a sentence's audio is addressed
    # by the hash of the sentence.
    location /voice/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A single-page app: every unknown path is a route, not a missing file.
    # Without this, reloading inside /reading/wordwork/some-text returns 404 —
    # which is exactly the deep-link behaviour the routes were added for.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
